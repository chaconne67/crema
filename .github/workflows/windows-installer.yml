# The one path Crema's installer is built, verified and released on: a clean Windows machine
# with no Hermes, no Python and no extra fonts, like a new user's PC.
name: Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["server/**", ".github/workflows/server.yml", "scripts/engine-tests/**", ".github/workflows/engine-tests.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    # Not windows-latest (Server 2025): its WebView2 152 never opens the DevTools port WebDriver needs
    # (actions/runner-images#14738), so the installed app could not be driven there.
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Builds the bundled engine (scripts/build-engine.ps1, run by the Tauri build).
      - uses: astral-sh/setup-uv@v6

      - name: Unit tests
        run: |
          npm ci
          npm test

      - name: Build installer
        run: npm run tauri build -- --bundles nsis

      - name: Install as a user would (silent)
        shell: pwsh
        run: |
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          "installer: {0:N0} MB" -f ($setup.Length / 1MB)
          $run = Start-Process $setup.FullName -ArgumentList "/S" -Wait -PassThru
          if ($run.ExitCode -ne 0) { throw "installer exit $($run.ExitCode)" }
          $app = "$env:LOCALAPPDATA\Crema\app.exe"
          if (-not (Test-Path $app)) { throw "Crema not installed at $app" }
          $engine = "$env:LOCALAPPDATA\Crema\engine"
          foreach ($file in "python\python.exe", "src\crema_engine.py", "engine.commit", "lib\fts5_cjk.dll", "model\model.onnx", "model\tokenizer.json") {
            if (-not (Test-Path "$engine\$file")) { throw "engine file missing: $file" }
          }
          "engine: $(Get-Content "$engine\engine.commit")"
          # The Thock built in for the 9,900원 plan (scripts/build-thock.ps1).
          foreach ($file in "Thock.exe", "thock.commit", "_internal\thock\settings.html") {
            if (-not (Test-Path "$env:LOCALAPPDATA\Crema\thock\$file")) { throw "thock file missing: $file" }
          }
          "thock: $(Get-Content "$env:LOCALAPPDATA\Crema\thock\thock.commit")"
          # The bundled Python loads the Korean/CJK tokenizer and finds a two-letter word with it.
          @'
          import sqlite3, sys
          c = sqlite3.connect(":memory:")
          c.enable_load_extension(True)
          c.load_extension(sys.argv[1])
          c.execute("CREATE VIRTUAL TABLE t USING fts5(x, tokenize='cjk_unicode61')")
          c.execute("INSERT INTO t VALUES ('이번 달 세금 신고 일정')")
          assert c.execute("SELECT count(*) FROM t WHERE t MATCH '세금'").fetchone()[0] == 1
          print("two-letter Korean search: ok")
          '@ | Set-Content cjk-check.py -Encoding utf8
          & "$engine\python\python.exe" cjk-check.py "$engine\lib\fts5_cjk.dll"
          if ($LASTEXITCODE) { throw "the bundled Python could not search Korean with fts5_cjk.dll" }
          # The bundled model puts a question in other words next to the page that answers it.
          @'
          import sys, time
          from pathlib import Path
          sys.path.insert(0, sys.argv[1])
          from agent.knowledge_embed import Embedder
          t = time.time()
          e = Embedder(Path(sys.argv[2]))
          pages = e.encode(["사무실 프린터 인쇄 안 됨: 스풀러를 다시 시작해 해결", "노트북 와이파이 끊김: 어댑터 절전을 꺼서 해결"])
          sims = pages @ e.encode(["출력이 안 나와요"], "query")[0]
          print(f"meaning: printer {sims[0]:.3f}, wifi {sims[1]:.3f}, {time.time() - t:.1f}s")
          assert sims[0] > sims[1]
          '@ | Set-Content meaning-check.py -Encoding utf8
          & "$engine\python\python.exe" meaning-check.py "$engine\src" "$engine\model"
          if ($LASTEXITCODE) { throw "the bundled meaning search model did not work" }
          "APP=$app" >> $env:GITHUB_ENV

      - name: WebDriver for the installed app
        shell: pwsh
        run: |
          cargo install tauri-driver --locked
          $key = 'HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}'
          $version = (Get-ItemProperty $key).pv
          Invoke-WebRequest "https://msedgedriver.microsoft.com/$version/edgedriver_win64.zip" -OutFile edgedriver.zip
          Expand-Archive edgedriver.zip -DestinationPath edgedriver
          "EDGEDRIVER=$PWD\edgedriver\msedgedriver.exe" >> $env:GITHUB_ENV
          "WebView2 runtime $version; $(& "$PWD\edgedriver\msedgedriver.exe" --version)"

      - name: The installed app starts on its own
        shell: pwsh
        run: |
          $app = Start-Process $env:APP -PassThru
          Start-Sleep 15
          $app.Refresh()
          if ($app.HasExited) { throw "Crema exited on start with code $($app.ExitCode)" }
          "running, window: '$($app.MainWindowTitle)'"
          Stop-Process -Id $app.Id -Force

      - name: First launch, the bundled engine and a real reply, then relaunch
        shell: pwsh
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          $driver = Start-Process tauri-driver -ArgumentList "--native-driver", $env:EDGEDRIVER -PassThru
          Start-Sleep 3
          try { node tests/e2e/installed-app.mjs $env:APP; if ($LASTEXITCODE) { throw "installed-app checks failed" } }
          finally { Stop-Process -Id $driver.Id -Force -ErrorAction SilentlyContinue }

      - name: The engine ends with the app and leaves no Hermes behind
        shell: pwsh
        run: |
          Start-Sleep 3
          $left = Get-CimInstance Win32_Process -Filter "Name='python.exe'" | Where-Object { $_.ExecutablePath -like "$env:LOCALAPPDATA\Crema\*" }
          if ($left) { throw "engine still running after the app closed: $($left.ProcessId)" }
          if (Test-Path "$env:LOCALAPPDATA\hermes") { throw "a Hermes home was created at $env:LOCALAPPDATA\hermes" }
          $data = "$env:LOCALAPPDATA\local.agentclient.prototype\engine"
          if (-not (Test-Path "$data\state.db")) { throw "no engine data at $data" }
          "engine data: $data"
          # The engine made the Korean/CJK index of the chats.
          @'
          import sqlite3, sys
          c = sqlite3.connect(sys.argv[1])
          sys.exit(0 if c.execute("SELECT 1 FROM sqlite_master WHERE name = 'messages_fts_cjk'").fetchone() else 1)
          '@ | Set-Content cjk-index.py -Encoding utf8
          & "$env:LOCALAPPDATA\Crema\engine\python\python.exe" cjk-index.py "$data\state.db"
          if ($LASTEXITCODE) { throw "state.db has no Korean/CJK search index" }

      - uses: actions/upload-artifact@v4
        with:
          name: Crema-setup-x64
          path: src-tauri/target/release/bundle/nsis/*-setup.exe

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "tag $env:GITHUB_REF_NAME does not match app version $version" }
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Copy-Item $setup.FullName Crema-setup-x64.exe
          $sha = (Get-FileHash Crema-setup-x64.exe -Algorithm SHA256).Hash.ToLower()
          $notes = "Built and verified on a clean Windows runner.`n`nSHA-256: ``$sha``"
          gh release create $env:GITHUB_REF_NAME Crema-setup-x64.exe --title "Crema $version" --notes $notes
