{% load static %}<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% block title %}Crema — 나를 기억하는 내 PC의 AI 비서{% endblock %}</title>
    <meta name="description" content="하던 일, 실수, 정한 것을 기억하는 Windows용 AI 비서 Crema. 쓰던 AI 계정을 그대로 연결하고, 기억은 내 PC에 저장합니다." />
    <link rel="icon" href="{% static 'crema.svg' %}" type="image/svg+xml" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-kr@5/600.css" />
    <link rel="stylesheet" href="{% static 'site.css' %}" />
  </head>
  <body>
    <header class="site-header">
      <div class="wrap">
        <a class="brand" href="{% url 'home' %}"><img src="{% static 'crema.svg' %}" alt="" />Crema</a>
        <nav aria-label="사이트">
          {% if user.is_authenticated %}
            <a href="{% url 'account' %}">내 계정</a>
            <a class="button small" href="{% url 'start' %}">설치 파일 받기</a>
          {% else %}
            <a class="hide-narrow" href="{% url 'home' %}#price">가격</a>
            <a class="hide-narrow" href="{% url 'home' %}#faq">자주 묻는 질문</a>
            <a class="button small" href="{% url 'google_login' %}?next={% url 'start' %}">Google로 시작하기</a>
          {% endif %}
        </nav>
      </div>
    </header>
    <main>{% block content %}{% endblock %}</main>
    <footer class="site-footer">
      <div class="wrap">
        <span>© Crema</span>
        <nav aria-label="약관">
          <a href="{% url 'privacy' %}">개인정보처리방침</a>
          <a href="{% url 'terms' %}">이용약관</a>
          {% if contact_email %}<a href="mailto:{{ contact_email }}">문의</a>{% endif %}
        </nav>
      </div>
    </footer>
  </body>
</html>
