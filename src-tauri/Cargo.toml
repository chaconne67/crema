[package]
name = "app"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
# "unstable": the sign-up guide shows a site as a second webview inside the main window.
tauri = { version = "2.11.6", features = ["unstable"] }
tauri-plugin-log = "2"
reqwest = { version = "0.12", features = ["stream", "json"] }
futures-util = "0.3"
keyring = { version = "3", features = ["windows-native"] }
tokio = { version = "1", features = ["sync", "time", "macros"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
# Crema account sign-in (PKCE): already in the dependency tree through Tauri and reqwest.
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.3"

# Ends the bundled engine with the app (a Windows job object); already in the dependency tree through Tauri.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }
# The sign-up guide's screen capture (WebView2 CapturePreview); both already in the tree through Tauri's wry.
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Memory"] }
